name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Una ejecucion por rama: un push nuevo cancela el anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migraciones contra MySQL real
    runs-on: ubuntu-latest
    env:
      # `db/cli.js` solo permite reset y seeds con NODE_ENV development o test, y
      # sin definir lo rechaza por tratar el entorno desconocido como el mas
      # peligroso. La base del runner es efimera, asi que test es lo honesto.
      NODE_ENV: test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Crear esquemas y usuarios
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: ci-root
          DB_AUTH_PASSWORD: ci-auth
          DB_PROVIDER_PASSWORD: ci-provider
          DB_CATALOG_PASSWORD: ci-catalog
          DB_REQUEST_PASSWORD: ci-request
          DB_RATING_PASSWORD: ci-rating
          DB_NOTIFICATION_PASSWORD: ci-notification
          DB_ADMIN_PASSWORD: ci-admin
        run: |
          sudo apt-get install -y mysql-client
          bash db/init/01-schemas-and-users.sh

      # Sin esto, `CREATE TRIGGER` falla con "You do not have the SUPER
      # privilege and binary logging is enabled". La imagen mysql:8.0 trae el log
      # binario activo, y crear un disparador con el binario abierto exige SUPER o
      # esta variable. Conceder SUPER a pa_admin_svc romperia el privilegio minimo
      # (SRS RNF28), asi que se ajusta el servidor, que es lo que ya hace
      # docker-compose.yml en local con --log-bin-trust-function-creators=ON.
      - name: Permitir disparadores sin SUPER
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: ci-root
        run: |
          sudo apt-get install -y mysql-client
          mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B \
            -e "SELECT CONCAT('log_bin_trust_function_creators=', @@log_bin_trust_function_creators);"

      - name: Aplicar migraciones
        env:
          MYSQL_HOST: 127.0.0.1
          DB_AUTH_USER: pa_auth_svc
          DB_AUTH_PASSWORD: ci-auth
          DB_PROVIDER_USER: pa_provider_svc
          DB_PROVIDER_PASSWORD: ci-provider
          DB_CATALOG_USER: pa_catalog_svc
          DB_CATALOG_PASSWORD: ci-catalog
          DB_REQUEST_USER: pa_request_svc
          DB_REQUEST_PASSWORD: ci-request
          DB_RATING_USER: pa_rating_svc
          DB_RATING_PASSWORD: ci-rating
          DB_NOTIFICATION_USER: pa_notification_svc
          DB_NOTIFICATION_PASSWORD: ci-notification
          DB_ADMIN_USER: pa_admin_svc
          DB_ADMIN_PASSWORD: ci-admin
        run: npm run db:migrate

      # Una migracion que no sabe deshacerse no es reversible. Se comprueba en CI
      # y no cuando hay que revertir un despliegue en produccion.
      - name: Verificar que las migraciones son reversibles
        env:
          MYSQL_HOST: 127.0.0.1
          DB_AUTH_USER: pa_auth_svc
          DB_AUTH_PASSWORD: ci-auth
          DB_PROVIDER_USER: pa_provider_svc
          DB_PROVIDER_PASSWORD: ci-provider
          DB_CATALOG_USER: pa_catalog_svc
          DB_CATALOG_PASSWORD: ci-catalog
          DB_REQUEST_USER: pa_request_svc
          DB_REQUEST_PASSWORD: ci-request
          DB_RATING_USER: pa_rating_svc
          DB_RATING_PASSWORD: ci-rating
          DB_NOTIFICATION_USER: pa_notification_svc
          DB_NOTIFICATION_PASSWORD: ci-notification
          DB_ADMIN_USER: pa_admin_svc
          DB_ADMIN_PASSWORD: ci-admin
        run: npm run db:reset

  # Una sola puerta, la misma que se ejecuta en local con `npm run verify`.
  #
  # Antes esto se repartia en tres jobs (formato/lint/tipos, unitarias e
  # integracion por separado, y dependencias). Separate hacia bien para ver
  # quickly que fallo, pero dejaba dos huecos reales: `test:unit` y
  # `test:integration` no pasaban `--coverage`, asi que el umbral de cobertura no
  # se comprobaba en ningun sitio, y las pruebas web de Vitest no se ejecutaban
  # en CI en absoluto. Ademas el job de integracion no declaraba servicios ni
  # variables de base de datos, asi que no podia pasar.
  #
  # Aqui van los tres servicios de verdad y `verify` entero, de forma que la
  # puerta de la calle es la misma que la de la casa.
  verify:
    name: Puerta completa
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pa_dev
          RABBITMQ_DEFAULT_PASS: ci-rabbit
        ports: ['5672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20

    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_ROOT_PASSWORD: ci-root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: pa_dev
      RABBITMQ_PASSWORD: ci-rabbit
      INTERNAL_SERVICE_SECRET: ci-internal-secret
      DB_AUTH_USER: pa_auth_svc
      DB_AUTH_PASSWORD: ci-auth
      DB_PROVIDER_USER: pa_provider_svc
      DB_PROVIDER_PASSWORD: ci-provider
      DB_CATALOG_USER: pa_catalog_svc
      DB_CATALOG_PASSWORD: ci-catalog
      DB_REQUEST_USER: pa_request_svc
      DB_REQUEST_PASSWORD: ci-request
      DB_RATING_USER: pa_rating_svc
      DB_RATING_PASSWORD: ci-rating
      DB_NOTIFICATION_USER: pa_notification_svc
      DB_NOTIFICATION_PASSWORD: ci-notification
      DB_ADMIN_USER: pa_admin_svc
      DB_ADMIN_PASSWORD: ci-admin
      # Sin esto, un fallo de arranque de las pruebas de integracion se
      # convierte en una omision silenciosa y la suite pasa sin ejecutar nada.
      REQUIRE_INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Crear esquemas y usuarios
        run: |
          sudo apt-get install -y mysql-client
          bash db/init/01-schemas-and-users.sh

      # Ver el job de migraciones: la imagen mysql:8.0 trae el log binario
      # activo, y sin esta variable `CREATE TRIGGER` exige SUPER.
      - name: Permitir disparadores sin SUPER
        run: |
          sudo apt-get install -y mysql-client
          mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Aplicar migraciones
        run: npm run db:migrate

      # Sin esto el alta de usuario falla con "Roles no registrados en el
      # catalogo: SOLICITANTE": KnexUsuarioRepository resuelve los roles contra
      # la tabla `rol`, y las migraciones crean el esquema pero no el catalogo.
      # En local nunca se noto porque el desarrollador ya tenia los seeds cargados.
      - name: Cargar datos iniciales
        env:
          # Solo para esta ejecucion efimera; el CLI exige 12 caracteres.
          SEED_DEV_PASSWORD: ci-solo-esta-ejecucion
        run: npm run db:seed

      # Claves efimeras, solo para esta ejecucion. El codigo espera el PEM con
      # los saltos escapados como `\n`, porque es el formato que produce un
      # fichero .env, y lo convierte con un replace al leerlo.
      - name: Generar claves JWT de la ejecucion
        run: |
          openssl genrsa -out "$RUNNER_TEMP/private.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          PRIVADO=$(sed ':a;N;$!ba;s/\n/\\n/g' "$RUNNER_TEMP/private.pem")
          PUBLICO=$(sed ':a;N;$!ba;s/\n/\\n/g' "$RUNNER_TEMP/public.pem")
          echo "JWT_PRIVATE_KEY=$PRIVADO" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$PUBLICO" >> "$GITHUB_ENV"

      # Formato, lint, tipos, las 320 pruebas de Jest con cobertura, las 124 de
      # Vitest y las dependencias. Una sola puerta, igual que en local.
      - name: verify
        run: npm run verify

  e2e:
    name: Recorrido en navegador
    runs-on: ubuntu-latest
    # Despues de la puerta: si el formato, los tipos o las pruebas estan rotos,
    # construir ocho imagenes para descubrirlo es tiempo tirado.
    needs: verify
    # El recorrido atraviesa cinco servicios y un broker; mas de media hora
    # significa que algo se quedo colgado.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # La pila se levanta con docker compose y NO con los `services` del
      # runner: los ocho servicios son contenedores construidos desde este
      # repositorio, y `services` solo sirve para imagenes ya publicadas.
      #
      # `env_file: [.env]` del compose exige un .env, asi que se parte del
      # ejemplo y se rellenan los valores que no pueden ir versionados.
      - name: Preparar el .env de la ejecucion
        run: |
          cp .env.example .env
          claves() { sed -i "s|^$1=.*|$1=$2|" .env; }
          claves MYSQL_ROOT_PASSWORD ci-root
          claves DB_AUTH_PASSWORD ci-auth
          claves DB_PROVIDER_PASSWORD ci-provider
          claves DB_CATALOG_PASSWORD ci-catalog
          claves DB_REQUEST_PASSWORD ci-request
          claves DB_RATING_PASSWORD ci-rating
          claves DB_NOTIFICATION_PASSWORD ci-notification
          claves DB_ADMIN_PASSWORD ci-admin
          claves RABBITMQ_PASSWORD ci-rabbit
          claves INTERNAL_SERVICE_SECRET ci-internal-secret-largo
          claves SEED_DEV_PASSWORD ci-solo-esta-ejecucion

          # Claves efimeras. El codigo espera el PEM con los saltos escapados
          # como `\n`, porque es el formato que produce un fichero .env.
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem
          # `printf "%s\\n"`: con una sola barra, awk emite un salto DE VERDAD
          # y la variable queda multilinea. Eso rompio el primer intento con
          # `sed: unterminated s command`.
          priv=$(awk '{printf "%s\\n", $0}' private.pem)
          pub=$(awk '{printf "%s\\n", $0}' public.pem)

          # Las claves se reemplazan quitando la linea y anadiendola al final, y
          # no con `sed`: el valor lleva barras y comillas, y escaparlo para el
          # lado derecho de una sustitucion es una fuente de fallos que no hace
          # falta correr.
          grep -v '^JWT_PRIVATE_KEY=' .env | grep -v '^JWT_PUBLIC_KEY=' > .env.tmp
          {
            echo "JWT_PRIVATE_KEY=\"$priv\""
            echo "JWT_PUBLIC_KEY=\"$pub\""
          } >> .env.tmp
          mv .env.tmp .env
          rm -f private.pem public.pem

          # Una clave vacia dejaria arrancar a auth-service y fallar al emitir
          # el primer token, con un error que no menciona esto.
          grep -q 'BEGIN PRIVATE KEY' .env || { echo 'La clave privada no entro en el .env'; exit 1; }
          grep -q 'BEGIN PUBLIC KEY' .env || { echo 'La clave publica no entro en el .env'; exit 1; }

      - name: Construir las imagenes
        run: docker compose --profile apps build

      # La superposicion eleva los limitadores de peticiones. Son una medida de
      # seguridad real y el recorrido los agota en segundos; el detalle esta en
      # docker-compose.e2e.yml.
      - name: Levantar la pila
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            --profile apps up -d --wait --wait-timeout 300

      - name: Estado de la pila
        run: |
          docker compose --profile apps ps
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8080/health

      # El `migrator` del compose ya aplico las migraciones; los seeds no, y sin
      # el catalogo de roles ni las categorias el recorrido no puede empezar.
      - name: Cargar datos iniciales
        env:
          MYSQL_HOST: 127.0.0.1
          NODE_ENV: development
        run: npm run db:seed

      # Las semillas NO escriben en el outbox: insertan filas y nada mas. Las
      # replicas de solo lectura se llenan con eventos, asi que en un entorno
      # recien creado `pa_request.categoria_ref` queda vacio y publicar una
      # necesidad se rechaza porque su categoria "no esta activa". Esto es
      # exactamente para lo que se construyo `db:reemit` en la Fase 5.
      - name: Reconstruir las replicas
        env:
          MYSQL_HOST: 127.0.0.1
          NODE_ENV: development
        run: npm run db:reemit

      # El relevo barre cada segundo y el consumidor tarda lo que tarde el
      # broker: sin esperar, el recorrido empieza contra una replica a medio
      # llenar y falla una vez cada tantas ejecuciones.
      - name: Esperar a que las replicas esten al dia
        run: |
          consulta='select count(*) from pa_request.categoria_ref where activa = 1;'
          for i in $(seq 1 30); do
            filas=$(docker exec pa-mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "$consulta" 2>/dev/null | tr -d "[:space:]")
            echo "intento $i: categorias activas replicadas = ${filas:-0}"
            if [ "${filas:-0}" -ge 1 ]; then exit 0; fi
            sleep 2
          done
          echo 'Las replicas no se llenaron en 60 s'
          docker compose --profile apps logs --tail 50 catalog-service request-service
          exit 1

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Recorrido
        env:
          CI: 'true'
          MYSQL_HOST: 127.0.0.1
        run: npm run e2e

      # Los registros de los contenedores, solo si fallo: sin ellos un fallo de
      # un servicio se lee como un fallo de la prueba.
      - name: Registros de la pila
        if: failure()
        run: docker compose --profile apps logs --tail 200

      - name: Artefactos de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
