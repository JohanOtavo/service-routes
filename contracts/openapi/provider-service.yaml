openapi: 3.0.3
info:
  title: Punto Amigo - provider-service
  version: 0.1.0
  description: >
    Perfiles de prestador, su validacion administrativa y su estado
    (SRS RF22 a RF32). NINGUNA respuesta publica incluye telefono ni correo: el
    contacto se revela cuando hay un acuerdo, y de eso es dueno request-service
    (RF31, RF156, RNF84).
servers:
  - url: http://localhost:8080
tags:
  - name: Perfil propio
  - name: Directorio
  - name: Revision administrativa

paths:
  /api/v1/providers:
    post:
      tags: [Perfil propio]
      summary: Crea el perfil del oferente (SRS RF22 a RF24)
      description: >
        Nace en PENDING_VALIDATION. El estado NO es un campo del cuerpo, de modo
        que ninguna peticion pueda darse por validada a si misma. Un usuario
        tiene como maximo un perfil (RF23).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nombre, especialidad]
              properties:
                nombre: { type: string, minLength: 2, maxLength: 100 }
                especialidad: { type: string, minLength: 2, maxLength: 150 }
                experiencia: { type: string, maxLength: 500, nullable: true }
                telefono: { type: string, maxLength: 20, nullable: true }
                correo: { type: string, maxLength: 150, nullable: true }
                disponibilidad: { type: string, maxLength: 255, nullable: true }
      responses:
        '201': { description: Perfil creado, en espera de validacion }
        '401': { $ref: '_shared.yaml#/components/responses/SinAutenticar' }
        '403': { $ref: '_shared.yaml#/components/responses/SinPermiso' }
        '409': { description: Ya tiene un perfil de prestador }
        '422': { $ref: '_shared.yaml#/components/responses/NoValido' }
    get:
      tags: [Directorio]
      summary: Directorio de prestadores validados (SRS RF25)
      description: Exige sesion. No devuelve datos de contacto.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '_shared.yaml#/components/parameters/pagina' }
        - { $ref: '_shared.yaml#/components/parameters/tamano' }
        - { name: especialidad, in: query, schema: { type: string, maxLength: 150 } }
      responses:
        '200': { description: Pagina de perfiles publicos }
        '401': { $ref: '_shared.yaml#/components/responses/SinAutenticar' }

  /api/v1/providers/me:
    get:
      tags: [Perfil propio]
      summary: Su propio perfil, con contacto incluido
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Perfil completo del propio oferente }
        '404': { description: Todavia no tiene perfil }

  /api/v1/providers/pending:
    get:
      tags: [Revision administrativa]
      summary: Cola de revision, los mas antiguos primero (SRS RF26)
      description: >
        Solo ADMINISTRADOR. Lista perfiles con sus datos de contacto, porque
        revisarlos es precisamente comprobar lo que el perfil afirma.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '_shared.yaml#/components/parameters/pagina' }
        - { $ref: '_shared.yaml#/components/parameters/tamano' }
      responses:
        '200': { description: Pagina de perfiles pendientes }
        '403': { $ref: '_shared.yaml#/components/responses/SinPermiso' }

  /api/v1/providers/{id}:
    get:
      tags: [Directorio]
      summary: Ficha publica de un prestador (SRS RF31)
      description: >
        Unica ruta del servicio que NO exige sesion. Un perfil que no sea
        visible responde 404 y no 403: un 403 confirmaria que existe.
        No incluye telefono, correo ni el identificador de la cuenta.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Ficha publica, sin datos de contacto }
        '404': { $ref: '_shared.yaml#/components/responses/NoEncontrado' }
    patch:
      tags: [Perfil propio]
      summary: Edita el perfil propio (SRS RF28)
      description: >
        La propiedad la decide el servidor comparando con el usuario del token.
        Editar NO devuelve el perfil a la cola de validacion.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                nombre: { type: string }
                especialidad: { type: string }
                experiencia: { type: string, nullable: true }
                telefono: { type: string, nullable: true }
                correo: { type: string, nullable: true }
                disponibilidad: { type: string, nullable: true }
      responses:
        '200': { description: Perfil actualizado }
        '404': { $ref: '_shared.yaml#/components/responses/NoEncontrado' }
        '422': { $ref: '_shared.yaml#/components/responses/NoValido' }
    delete:
      tags: [Perfil propio]
      summary: Retirada voluntaria del catalogo (SRS RF29)
      description: Pasa a INACTIVE. No borra nada; para volver pasa por validacion.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Perfil retirado }
        '404': { $ref: '_shared.yaml#/components/responses/NoEncontrado' }

  /api/v1/providers/{id}/full:
    get:
      tags: [Revision administrativa]
      summary: Ficha completa, con contacto (solo ADMINISTRADOR)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Ficha completa }
        '403': { $ref: '_shared.yaml#/components/responses/SinPermiso' }
        '404': { $ref: '_shared.yaml#/components/responses/NoEncontrado' }

  /api/v1/providers/{id}/validate:
    post:
      tags: [Revision administrativa]
      summary: Valida un perfil (SRS RF26)
      description: Pasa a ACTIVE y deja asiento con el administrador responsable.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Perfil validado }
        '403': { $ref: '_shared.yaml#/components/responses/SinPermiso' }
        '409': { description: El estado actual no admite esa transicion }

  /api/v1/providers/{id}/reject:
    post:
      tags: [Revision administrativa]
      summary: Rechaza un perfil (SRS RF27)
      description: >
        El motivo es obligatorio: un rechazo sin explicacion solo produce un
        segundo intento identico.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo]
              properties: { motivo: { type: string, minLength: 10, maxLength: 500 } }
      responses:
        '200': { description: Perfil rechazado }
        '403': { $ref: '_shared.yaml#/components/responses/SinPermiso' }
        '422': { $ref: '_shared.yaml#/components/responses/NoValido' }

  /api/v1/providers/{id}/status:
    patch:
      tags: [Revision administrativa]
      summary: Cambia el estado de un perfil (SRS RF29, RF30)
      description: >
        Las transiciones salen de una tabla explicita. Dos ausencias son
        deliberadas: PENDING_VALIDATION no pasa a SUSPENDED, e INACTIVE no pasa
        a ACTIVE sino a PENDING_VALIDATION, para que un perfil rechazado vuelva
        a revisarse en lugar de reactivarse de un salto.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [destino]
              properties:
                destino:
                  type: string
                  enum: [PENDING_VALIDATION, ACTIVE, SUSPENDED, INACTIVE]
                motivo: { type: string, minLength: 3, maxLength: 500, nullable: true }
      responses:
        '200': { description: Estado cambiado }
        '403': { $ref: '_shared.yaml#/components/responses/SinPermiso' }
        '409': { description: Transicion no contemplada por el modelo de estados }
