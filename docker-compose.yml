# Punto Amigo — entorno local completo.
#
# Estado: Fase 1 (base de datos). Levanta la infraestructura y aplica las
# migraciones de los 7 esquemas. Los 8 servicios de aplicacion y el cliente web
# se incorporan en las Fases 2 y 3, bajo el perfil "apps".
#
#   docker compose up -d          → infraestructura + migraciones + seeds
#   docker compose --profile apps up -d   → lo anterior + servicios (Fase 2)

name: punto-amigo

services:
  mysql:
    image: mysql:8.0
    container_name: pa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
      # Las contrasenas por servicio se inyectan al script de init.
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?}
      DB_PROVIDER_PASSWORD: ${DB_PROVIDER_PASSWORD:?}
      DB_CATALOG_PASSWORD: ${DB_CATALOG_PASSWORD:?}
      DB_REQUEST_PASSWORD: ${DB_REQUEST_PASSWORD:?}
      DB_RATING_PASSWORD: ${DB_RATING_PASSWORD:?}
      DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD:?}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # Modo estricto: una insercion invalida falla en vez de truncar en silencio.
      - --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO
      # Permite que un usuario sin SUPER cree disparadores.
      #
      # Con el log binario activo MySQL exige SUPER para crear un disparador,
      # porque uno no determinista puede desincronizar una replica.
      # pa_admin_svc necesita crear los dos que hacen inmutable la auditoria
      # (RF103), y concederle SUPER seria darle el control del servidor entero:
      # justo lo contrario del minimo privilegio que exige RNF28.
      #
      # Los disparadores de este proyecto solo ejecutan SIGNAL para abortar una
      # escritura, asi que son deterministas y no afectan a la replicacion.
      - --log-bin-trust-function-creators=ON
    ports:
      # Solo loopback. Las siete cuentas de servicio se crean con comodin de
      # host ('%') porque cada servicio corre en su propio contenedor; publicar
      # el puerto en todas las interfaces las expondria a la red local.
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # Los .sh y .sql de este directorio corren una sola vez, al crear el volumen.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y no por socket, deliberadamente.
      #
      # El entrypoint de MySQL levanta un servidor TEMPORAL para ejecutar los
      # scripts de inicializacion, y ese servidor solo escucha por socket. Un
      # ping contra 'localhost' lo alcanza y da la instancia por sana cuando
      # todavia no acepta conexiones TCP: el migrador arranca entonces y muere
      # con ECONNREFUSED. Forzar --protocol=TCP hace que la comprobacion mida lo
      # que de verdad importa, que es si los servicios pueden conectarse.
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-P',
          '3306',
          '--protocol=TCP',
          '-u',
          'root',
          '-p${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [punto-amigo]

  redis:
    image: redis:7-alpine
    container_name: pa-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [punto-amigo]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pa_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:15672:15672' # consola de administracion
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [punto-amigo]

  # Servicio de un solo uso: aplica las migraciones de los siete esquemas y, en
  # desarrollo, carga los seeds. Termina con codigo 0 y no queda corriendo.
  migrator:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: punto-amigo/migrator:local
    container_name: pa-migrator
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      NODE_ENV: ${NODE_ENV:-development}
    entrypoint: ['sh', 'db/entrypoint.sh']
    command: []
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'
    networks: [punto-amigo]

  # ─── Aplicacion (perfil "apps") ───────────────────────────────────────────
  #
  # Ningun servicio publica su puerto: solo el gateway es alcanzable desde
  # fuera (SRS-GW-01, RNF25). Los demas se hablan por el nombre de la red
  # interna de Docker.

  auth-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: punto-amigo/auth-service:local
    container_name: pa-auth
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      NODE_ENV: ${NODE_ENV:-development}
    # Sin `ports`: deliberado. Alcanzarlo desde el host exigiria publicarlo, y
    # entonces dejaria de ser interno.
    depends_on:
      mysql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [punto-amigo]

  provider-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/provider-service/Dockerfile
    image: punto-amigo/provider-service:local
    container_name: pa-provider
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      NODE_ENV: ${NODE_ENV:-development}
    # Sin `ports`: igual que auth-service, solo el gateway sale al host.
    # Sin `depends_on` de rabbitmq: el servicio arranca con el broker caido y
    # sus eventos esperan en el outbox. Esperarlo convertiria una caida del
    # broker en una caida del catalogo de prestadores, que se consulta sin
    # necesitar eventos.
    depends_on:
      mysql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [punto-amigo]

  request-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/request-service/Dockerfile
    image: punto-amigo/request-service:local
    container_name: pa-request
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      NODE_ENV: ${NODE_ENV:-development}
    # Sin `depends_on` de rabbitmq: arranca con el broker caido y sus eventos
    # esperan en el outbox. Esperarlo impediria consultar contrataciones ya
    # cerradas solo porque la mensajeria este abajo.
    depends_on:
      mysql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [punto-amigo]

  catalog-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: punto-amigo/catalog-service:local
    container_name: pa-catalog
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      NODE_ENV: ${NODE_ENV:-development}
    # Sin `depends_on` de rabbitmq: la busqueda del catalogo es lo primero que
    # ve quien llega y no necesita eventos para funcionar.
    depends_on:
      mysql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [punto-amigo]

  rating-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/rating-service/Dockerfile
    image: punto-amigo/rating-service:local
    container_name: pa-rating
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [punto-amigo]

  notification-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: punto-amigo/notification-service:local
    container_name: pa-notification
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [punto-amigo]

  api-gateway:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: punto-amigo/api-gateway:local
    container_name: pa-gateway
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      NODE_ENV: ${NODE_ENV:-development}
      UPSTREAM_AUTH_URL: http://auth-service:3001
      UPSTREAM_PROVIDER_URL: http://provider-service:3002
      UPSTREAM_REQUEST_URL: http://request-service:3004
      UPSTREAM_CATALOG_URL: http://catalog-service:3003
      UPSTREAM_RATING_URL: http://rating-service:3005
      UPSTREAM_NOTIFICATION_URL: http://notification-service:3006
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    # Solo espera a auth-service, no a los ocho servicios. Para los demas basta
    # el cortocircuito del propio gateway: si uno no responde, devuelve 503 en
    # SU prefijo. Esperarlos a todos haria que un servicio roto impidiera
    # arrancar el gateway, y con el las rutas que si funcionaban.
    networks: [punto-amigo]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  punto-amigo:
    driver: bridge
